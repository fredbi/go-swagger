baseURL: https://goswagger.io/go-swagger
title: go-swagger
theme: hugo-relearn
languageCode: en-us

# Enable features
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true

# Content configuration
contentDir: content

# Output formats
outputs:
  home:
    - html
    - rss
    - print

# Markup configuration
markup:
  goldmark:
    renderer:
      unsafe: true  # Allow raw HTML in markdown
    parser:
      attribute:
        title: true
        block: true
    renderHooks:
      image:
        # let the Relearn image render hook handle images (lightbox, zoom, ?classes=)
        useEmbedded: never
  highlight:
    codeFences: true
    guessSyntax: false
    lineNos: false
    lineNumbersInTable: false
    noClasses: true
    style: monokai
    tabWidth: 4

# Taxonomies are disabled for now
disableKinds:
  - taxonomy
  - term
# Module mounts
# Following go-swagger pattern: simple mounts for content and assets
module:
  mounts:
    # Custom layouts (override theme if needed)
    - source: layouts
      target: layouts

    # Generated documentation content
    - source: '../../../docs/doc-site'
      target: content

    # Custom SCSS (for theme customization) + logo
    - source: themes/go-swagger-assets
      target: assets

    # Custom static files (favicon)
    - source: themes/go-swagger-static
      target: static

# Relearn theme parameters
params:
  editURL: 'https://github.com/go-swagger/go-swagger/edit/master/'
  externalLinkTarget: _blank

  # Repository info
  sourceRepository: 'https://github.com/go-swagger/go-swagger'

  # Branding
  author:
    name: 'go-openapi maintainers'
  hideAuthorEmail: true

  # Theme customization
  themeVariant:
    - zen-dark
    - relearn-dark
    - relearn-light
  showVisitedLinks: true
  collapsibleMenu: true
  disableBreadcrumb: false
  disableNextPrev: false
  disableLandingPageButton: true
  titleSeparator: '|'

  # Features
  search:
    disable: false
    index:
      disable: false
    page:
      disable: false
    adapter:
      identifier: lunr
  disableLanguageSwitchingButton: true
  disableInlineCopyToClipBoard: false

  # Menu ordering
  ordersectionsby: 'weight'
  # Proposal for enhancement: configure versions
  #versions:
  #- baseURL: https://go-swagger.github.io/go-swagger/
  #  identifier: v2.1.0
  #  isLatest: true
  #version: 'v2.1.0'

  # Custom params
  goswagger:
    goVersion: ''
    latestRelease: ''
    versionMessage: ''
    buildTime: ''

# Menu configuration
menu:
  shortcuts:
    - name: "go-openapi toolkit"
      identifier: go-openapi
      url: "https://github.com/go-openapi"
      weight: 20

  before:
    - name: "Find go-swagger on github"
      url: "https://github.com/go-swagger/go-swagger"
      weight: 1
    - name: ""
      pre: "<hr>"
      weight: 10

  after:
    - name: ""
      pre: "<hr>"
      post: '<div style="color:aqua; font-weight:bold">The go-openapi toolkit</div>'
      url: "https://github.com/go-openapi"
      weight: 1
    - name: "go-openapi/analysis"
      url: "https://github.com/go-openapi/analysis"
      weight: 10
    - name: "go-openapi/errors"
      url: "https://github.com/go-openapi/errors"
      weight: 20
    - name: "go-openapi/inflect"
      url: "https://github.com/go-openapi/inflect"
      weight: 25
    - name: "go-openapi/jsonpointer"
      url: "https://github.com/go-openapi/jsonpointer"
      weight: 30
    - name: "go-openapi/jsonpointer"
      url: "https://github.com/go-openapi/jsonreference"
      weight: 40
    - name: "go-openapi/loads"
      url: "https://github.com/go-openapi/loads"
      weight: 50
    - name: "go-openapi/runtime"
      url: "https://github.com/go-openapi/runtime"
      weight: 60
    - name: "go-openapi/spec"
      url: "https://github.com/go-openapi/spec"
      weight: 70
    - name: "go-openapi/strfmt"
      url: "https://github.com/go-openapi/strfmt"
      weight: 80
    - name: "go-openapi/swag"
      url: "https://github.com/go-openapi/swag"
      weight: 90
    - name: "go-openapi/validate"
      url: "https://github.com/go-openapi/validate"
      weight: 100

# Privacy settings
privacy:
  disqus:
    disable: true
  googleAnalytics:
    disable: true
