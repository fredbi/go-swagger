baseURL: https://goswagger.io/go-swagger
title: go-swagger
theme: hugo-relearn
languageCode: en-us

# Enable features
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true

# Content configuration
contentDir: content

# Output formats
outputs:
  home:
    - html
    - rss
    - print

# Markup configuration
markup:
  goldmark:
    renderer:
      unsafe: true  # Allow raw HTML in markdown
    parser:
      attribute:
        title: true
        block: true
    renderHooks:
      image:
        # let the Relearn image render hook handle images (lightbox, zoom, ?classes=)
        useEmbedded: never
  highlight:
    codeFences: true
    guessSyntax: false
    lineNos: false
    lineNumbersInTable: false
    noClasses: true
    style: monokai
    tabWidth: 4

# Taxonomies are disabled for now
disableKinds:
  - taxonomy
  - term
# Module mounts
# Following go-swagger pattern: simple mounts for content and assets
module:
  mounts:
    # Custom layouts (override theme if needed)
    - source: layouts
      target: layouts

    # Generated documentation content
    - source: '../../../docs/doc-site'
      target: content

    # Custom SCSS (for theme customization) + logo
    - source: themes/go-swagger-assets
      target: assets

    # Custom static files (favicon)
    - source: themes/go-swagger-static
      target: static

# Relearn theme parameters
params:
  editURL: 'https://github.com/go-swagger/go-swagger/edit/master/'
  externalLinkTarget: _blank

  # Repository info
  sourceRepository: 'https://github.com/go-swagger/go-swagger'

  # Branding
  author:
    name: 'go-openapi maintainers'
  hideAuthorEmail: true

  # Theme customization
  themeVariant:
    - zen-dark
    - relearn-dark
    - relearn-light
  showVisitedLinks: true
  collapsibleMenu: true
  disableBreadcrumb: false
  disableNextPrev: false
  disableLandingPageButton: true
  titleSeparator: '|'

  # Features
  search:
    disable: false
    index:
      disable: false
    page:
      disable: false
    adapter:
      identifier: lunr
  disableLanguageSwitchingButton: true
  disableInlineCopyToClipBoard: false

  # Menu ordering
  ordersectionsby: 'weight'
  # Proposal for enhancement: configure versions
  #versions:
  #- baseURL: https://go-swagger.github.io/go-swagger/
  #  identifier: v2.1.0
  #  isLatest: true
  #version: 'v2.1.0'

  # Custom params
  goswagger:
    goVersion: ''
    latestRelease: ''
    versionMessage: ''
    buildTime: ''

# Menu configuration
menu:
  shortcuts:
    - name: "The go-openapi toolkit on github"
      identifier: go-openapi
      url: "https://github.com/go-openapi"
      weight: 20

    - name: "codegen examples"
      identifier: examples
      url: "https://go-openapi.github.io/examples"
      weight: 35

    - name: "codescan docs & examples"
      identifier: codescan
      url: "https://go-openapi.github.io/codescan"
      weight: 30

    - name: "runtime docs & examples"
      identifier: runtime
      url: "https://go-openapi.github.io/runtime"
      weight: 35

    - name: "testify/v2 docs"
      identifier: testify
      url: "https://go-openapi.github.io/testify"
      weight: 40

    - name: "general docs & news"
      identifier: github
      url: "https://github.com/go-openapi/doc-site"
      weight: 45

# Privacy settings
privacy:
  disqus:
    disable: true
  googleAnalytics:
    disable: true
